<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Geneology — Ubuntu HRMS</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    h1 {
      color: white;
      text-align: center;
      margin-bottom: 10px;
      font-size: 2.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }

    .subtitle {
      color: rgba(255,255,255,0.9);
      text-align: center;
      margin-bottom: 30px;
      font-size: 1.1rem;
    }

    .search-box {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .search-box input {
      width: 100%;
      padding: 15px 20px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    .search-box input:focus {
      outline: none;
      border-color: #667eea;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
    }

    .dashboard-card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .dashboard-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 12px rgba(0,0,0,0.15);
    }

    .dashboard-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .dashboard-header h2 {
      font-size: 1.3rem;
      margin: 0;
    }

    .dashboard-header .toggle {
      font-size: 1.5rem;
      transition: transform 0.3s;
    }

    .dashboard-header .toggle.open {
      transform: rotate(180deg);
    }

    .dashboard-content {
      padding: 20px;
      display: none;
    }

    .dashboard-content.open {
      display: block;
    }

    .nav-group {
      margin-bottom: 20px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      overflow: hidden;
    }

    .nav-group-header {
      background: #f7fafc;
      padding: 12px 15px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      color: #2d3748;
      transition: background 0.2s;
    }

    .nav-group-header:hover {
      background: #edf2f7;
    }

    .nav-group-header .toggle {
      font-size: 0.8rem;
      transition: transform 0.3s;
    }

    .nav-group-header .toggle.open {
      transform: rotate(180deg);
    }

    .nav-group-content {
      display: none;
      padding: 15px;
    }

    .nav-group-content.open {
      display: block;
    }

    .nav-item {
      padding: 10px 15px;
      margin-bottom: 10px;
      background: #f7fafc;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .nav-item:hover {
      background: #edf2f7;
    }

    .nav-item-label {
      font-weight: 500;
      color: #4a5568;
      margin-bottom: 8px;
    }

    .interactive-elements {
      margin-top: 10px;
      padding-left: 15px;
      border-left: 3px solid #667eea;
    }

    .interactive-element {
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #718096;
    }

    .interactive-element code {
      background: #fef3c7;
      color: #92400e;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .path-link {
      color: #667eea;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s, text-decoration 0.2s;
    }

    .path-link:hover {
      color: #764ba2;
      text-decoration: underline;
    }

    .leaf-content {
      margin-top: 10px;
      padding: 10px;
      background: #e6fffa;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #2c7a7b;
    }

    .leaf-content strong {
      display: block;
      margin-bottom: 5px;
      color: #285e61;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-left: 8px;
    }

    .badge-admin { background: #c53030; color: white; }
    .badge-manager { background: #2b6cb0; color: white; }
    .badge-employee { background: #2f855a; color: white; }
    .badge-labourer { background: #d69e2e; color: white; }
    .badge-contractor { background: #805ad5; color: white; }

    .no-results {
      text-align: center;
      padding: 40px;
      color: white;
      font-size: 1.2rem;
    }

    @media (max-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
      
      h1 {
        font-size: 1.8rem;
      }
    }
  </style>
</head>

            name: "KPIs → My KPI",
            items: [
              {
                label: "KPI metrics display",
                elements: "Performance charts, Historical data table",
                leaf: "KPI dashboard with Delivery Rate, Average Rating, Completed Projects, Charts showing performance trends"
              }
            ]
          }
        ]
      }
    ];

    function renderDashboard(dashboard) {
      const card = document.createElement('div');
      card.className = 'dashboard-card';
      card.dataset.search = `${dashboard.name} ${dashboard.groups.map(g => g.name + ' ' + g.items.map(i => i.label + ' ' + i.elements).join(' ')).join(' ')}`.toLowerCase();

      const header = document.createElement('div');
      header.className = 'dashboard-header';
      header.innerHTML = `
        <h2>${dashboard.name} <span class="badge ${dashboard.badge}">${dashboard.groups.length} groups</span></h2>
        <span class="toggle">▼</span>
      `;

      const content = document.createElement('div');
      content.className = 'dashboard-content';

      dashboard.groups.forEach(group => {
        const groupDiv = document.createElement('div');
        groupDiv.className = 'nav-group';

        const groupHeader = document.createElement('div');
        groupHeader.className = 'nav-group-header';
        groupHeader.innerHTML = `
          <span>${group.name}</span>
          <span class="toggle">▼</span>
        `;

        const groupContent = document.createElement('div');
        groupContent.className = 'nav-group-content';

        group.items.forEach(item => {
          const itemDiv = document.createElement('div');
          itemDiv.className = 'nav-item';
          itemDiv.innerHTML = `
            <div class="nav-item-label">${item.label}</div>
            <div class="interactive-elements">
              <div class="interactive-element">${item.elements.split(', ').map(e => {
                const match = e.match(/(.+?)\s*→\s*(\/[^\s]+)/);
                if (match) {
                  return `<a href="${FRONTEND_BASE_URL}${match[2]}" target="_blank" class="path-link">${match[1]} → ${match[2]}</a>`;
                }
                return `<span>${e}</span>`;
              }).join('<br>')}</div>
              <div class="leaf-content"><strong>Leaf:</strong> ${item.leaf}</div>
            </div>
          `;
          groupContent.appendChild(itemDiv);
        });

        groupHeader.addEventListener('click', () => {
          groupHeader.querySelector('.toggle').classList.toggle('open');
          groupContent.classList.toggle('open');
        });

        groupDiv.appendChild(groupHeader);
        groupDiv.appendChild(groupContent);
        content.appendChild(groupDiv);
      });

      header.addEventListener('click', () => {
        header.querySelector('.toggle').classList.toggle('open');
        content.classList.toggle('open');
      });

      card.appendChild(header);
      card.appendChild(content);
      return card;
    }

    function renderAllDashboards() {
      const grid = document.getElementById('dashboardGrid');
      grid.innerHTML = '';
      genealogyData.forEach(dashboard => {
        grid.appendChild(renderDashboard(dashboard));
      });
    }

    function filterDashboards(searchTerm) {
      const term = searchTerm.toLowerCase();
      const cards = document.querySelectorAll('.dashboard-card');
      let hasResults = false;

      cards.forEach(card => {
        const searchData = card.dataset.search;
        if (searchData.includes(term)) {
          card.style.display = '';
          hasResults = true;
        } else {
          card.style.display = 'none';
        }
      });

      document.getElementById('noResults').style.display = hasResults ? 'none' : 'block';
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      filterDashboards(e.target.value);
    });

    // Initial render
    renderAllDashboards();
  </script>
</body>
</html>
